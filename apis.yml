name: Sunairio
description: >-
  Sunairio is a grid forecasting company that provides integrated weather,
  climate, and energy insights for power markets. Its flagship platform,
  Sunairio ONE, generates 1,000-member ensemble forecasts across horizons from
  hourly to decadal, capturing extreme-weather and grid-stress scenarios that
  traditional forecasts miss. The company also publishes SHED (Sunairio
  High-resolution Earth Data), a proprietary historical weather dataset for the
  Continental US from 1950 to present at roughly 100x the resolution of ERA5,
  with asset-level wind and solar variability. Customers such as energy traders,
  grid operators, utility-scale asset developers, and demand-response
  aggregators access forecasts and data through a web UI, an API, and (on higher
  tiers) direct Snowflake data delivery. Founded in 2020 by Rob Cirincione, the
  company has been recognized by the National Science Foundation, American Clean
  Power, and EPRI.
